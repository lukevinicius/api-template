services:
  server:
    build:
      context: .
    ports:
      - 3333:3000
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - api-network
    command: bun run dev

  database:
    restart: always
    image: bitnami/postgresql:latest
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: api-db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - api_ms_pg_data:/bitnami/postgresql
    networks:
        - api-network

volumes:
  api_ms_pg_data:

networks:
  api-network: